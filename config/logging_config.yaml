# Logging Configuration
version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json_formatter:
    format: '{"time": "%(asctime)s", "level": "%(levelname)s", "module": "%(name)s", "line": %(lineno)d, "message": "%(message)s"}'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: outputs/logs/lunar_pipeline.log
    maxBytes: 10485760 # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  lunar_core:
    level: DEBUG
    handlers: [console, file_handler]
    propagate: False

root:
  level: INFO
  handlers: [console, file_handler]
