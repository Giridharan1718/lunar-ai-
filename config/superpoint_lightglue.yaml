# Deep Learning Feature Matcher Configuration: SuperPoint + LightGlue
superpoint:
  descriptor_dim: 256
  nms_radius: 4
  keypoint_threshold: 0.005
  max_keypoints: 2048
  remove_borders: 4
  device: "cuda"

lightglue:
  input_dim: 256
  descriptor_dim: 256
  num_layers: 9
  num_heads: 4
  flash_attention: true
  mp: true # mixed precision
  filter_threshold: 0.15 # match acceptance threshold
  depth_confidence: 0.95
  width_confidence: 0.99
  weights: "superpoint" # LightGlue pretrained weights for SuperPoint
